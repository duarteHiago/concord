# Configuração do LiveKit (SFU WebRTC). As chaves vêm da variável LIVEKIT_KEYS (docker-compose.yml).
port: 7880
rtc:
  # Mídia: 1 porta UDP (multiplexada) + fallback TCP para redes que bloqueiam UDP.
  udp_port: 7882
  tcp_port: 7881
  use_external_ip: true
room:
  empty_timeout: 300
  departure_timeout: 20
  # Codecs: a lista padrão do LiveKit + os perfis H.264 42001f/4d001f. Sem eles o servidor só aceita o
  # perfil 42e01f, e nesse perfil o Chromium codifica a tela pelo processador (OpenH264) mesmo com placa
  # NVIDIA/AMD/Intel. Com 42001f ele usa o codificador da placa de vídeo (NVENC etc.). Testado de ponta a ponta.
  enabled_codecs:
    - mime: audio/PCMU
    - mime: audio/PCMA
    - mime: audio/opus
    - mime: audio/red
    - mime: video/VP8
    - mime: video/H264
    - mime: video/H264
      fmtp_line: level-asymmetry-allowed=1;packetization-mode=1;profile-level-id=42001f
    - mime: video/H264
      fmtp_line: level-asymmetry-allowed=1;packetization-mode=1;profile-level-id=4d001f
    - mime: video/VP9
    - mime: video/AV1
    - mime: video/H265
    - mime: video/rtx
# Quem está falando (o destaque no avatar). O padrão avisa a cada 400 ms e ainda faz média de 2
# leituras, então o destaque acendia quase 1 s depois da pessoa começar a falar. Com 150 ms e sem
# média ele acompanha a voz; o app segura o destaque ~350 ms antes de apagar, então não pisca
# entre uma palavra e outra (client/src/store/voice.ts).
audio:
  update_interval: 150
  smooth_intervals: 1
# Métricas para o monitoramento (lidas pelo Prometheus em 127.0.0.1:16789). O LiveKit escuta em todas as
# interfaces; quem impede o acesso de fora é o firewall (deploy/setup.sh nega 16789/tcp).
prometheus_port: 16789
logging:
  level: info
