# Mantém as dependências em dia automaticamente: o Dependabot abre PR quando sai uma versão
# nova de alguma dependência, agrupando patch/minor pra não encher a aba de PRs de ruído —
# updates de major (que costumam quebrar algo) continuam vindo separados, um PR por pacote.
version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/client'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'deps(client)'

  - package-ecosystem: 'npm'
    directory: '/server'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'deps(server)'

  - package-ecosystem: 'npm'
    directory: '/desktop'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'deps(desktop)'

  - package-ecosystem: 'npm'
    directory: '/shared'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'deps(shared)'

  - package-ecosystem: 'npm'
    directory: '/examples/bot'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'deps(bot de exemplo)'

  - package-ecosystem: 'npm'
    directory: '/tests/e2e'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'deps(testes e2e)'

  # as próprias actions usadas nos workflows (actions/checkout, actions/setup-node etc.)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'deps(actions)'

  # imagem base do Dockerfile (node:24-alpine)
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'deps(docker)'
