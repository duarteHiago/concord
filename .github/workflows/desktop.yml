name: Desktop

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Compilar o capturador de áudio (C++)
        working-directory: desktop/native
        shell: cmd
        run: cl /nologo /O2 /EHsc /std:c++17 /W3 /DUNICODE /D_UNICODE audio-capture.cpp /Fe:audio-capture.exe

      # Os runners não têm placa de som, então a ativação pode falhar aqui; serve para ver a mensagem.
      - name: Testar o capturador
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath desktop/native/audio-capture.exe -ArgumentList '--exclude', $PID `
            -RedirectStandardError err.txt -RedirectStandardOutput out.bin -PassThru -NoNewWindow
          $p.WaitForExit(5000) | Out-Null
          if (-not $p.HasExited) { Stop-Process $p -Force }
          Get-Content err.txt

      - name: Dependências
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      # cada build tem versão nova (1.0.<nº da execução>): é o que o atualizador compara
      - name: Definir versão
        working-directory: desktop
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Gerar instalador
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never

      - name: Conferir pacote (atualizador incluído)
        working-directory: desktop
        shell: bash
        run: |
          # no Windows o asar lista os caminhos com "\"
          npx --yes @electron/asar@3.4.1 list release/win-unpacked/resources/app.asar > asar.txt
          grep -E 'node_modules[\\/]electron-updater[\\/]package\.json' asar.txt
          ls release
          cat release/latest.yml

      - uses: actions/upload-artifact@v7
        with:
          name: concord-desktop
          path: |
            desktop/release/Concord-Setup-*.exe
            desktop/release/Concord-Setup-*.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

  publish:
    name: Publicar na VPS
    needs: build
    if: github.ref == 'refs/heads/main' && vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: concord-desktop

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      # O app serve <dados>/downloads em https://DOMINIO/downloads/.
      # O latest.yml vai por último: só depois que o instalador está lá os apps veem a versão nova.
      - name: Publicar versão
        run: |
          D=/opt/concord/data/downloads
          FILE=$(ls Concord-Setup-*.exe | head -1)
          ssh "$TARGET" "mkdir -p $D"
          scp -q "$FILE" "$FILE.blockmap" "$TARGET:$D/"
          scp -q latest.yml "$TARGET:$D/latest.yml.tmp"
          ssh "$TARGET" "cd $D && mv latest.yml.tmp latest.yml \
            && cp '$FILE' Concord-Setup.exe.tmp && mv Concord-Setup.exe.tmp Concord-Setup.exe \
            && ls -t Concord-Setup-*.exe | tail -n +4 | while read f; do rm -f \"\$f\" \"\$f.blockmap\"; done \
            && ls -la"
