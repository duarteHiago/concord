name: Desktop

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  # no PR só compila e monta o instalador (para pegar erro antes do merge); publicar é só na main
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

# o token do GitHub só lê o código: o deploy é por SSH e nenhum job escreve no repositório
permissions:
  contents: read

jobs:
  build-win:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Compilar o capturador de áudio (C++)
        working-directory: desktop/native
        shell: cmd
        run: cl /nologo /O2 /EHsc /std:c++17 /W3 /DUNICODE /D_UNICODE audio-capture.cpp /Fe:audio-capture.exe

      - name: Compilar a tremida ao vivo (C++)
        working-directory: desktop/native
        shell: cmd
        run: cl /nologo /O2 /EHsc /std:c++17 /W3 /DUNICODE /D_UNICODE window-shake.cpp /Fe:window-shake.exe

      # Os runners não têm placa de som, então a ativação pode falhar aqui; serve para ver a mensagem.
      - name: Testar o capturador
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath desktop/native/audio-capture.exe -ArgumentList '--exclude', $PID `
            -RedirectStandardError err.txt -RedirectStandardOutput out.bin -PassThru -NoNewWindow
          $p.WaitForExit(5000) | Out-Null
          if (-not $p.HasExited) { Stop-Process $p -Force }
          Get-Content err.txt

      - name: Dependências
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      # cada build tem versão nova (1.0.<nº da execução>): é o que o atualizador compara
      - name: Definir versão
        working-directory: desktop
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Gerar instalador
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never

      # os apps só instalam atualização com esta assinatura (ver desktop/update-signature.cjs). Em PR de fork e em
      # PR do Dependabot o segredo não existe: só monta o instalador, sem assinar (e PR nunca publica).
      - name: Assinar a atualização
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.user.login != 'dependabot[bot]')
        working-directory: desktop
        env:
          DESKTOP_UPDATE_KEY: ${{ secrets.DESKTOP_UPDATE_KEY }}
        run: node scripts/sign-update.cjs

      - name: Conferir pacote (atualizador e chave pública incluídos)
        working-directory: desktop
        shell: bash
        run: |
          # no Windows o asar lista os caminhos com "\"
          npx --yes @electron/asar@3.4.1 list release/win-unpacked/resources/app.asar > asar.txt
          grep -E 'node_modules[\\/]electron-updater[\\/]package\.json' asar.txt
          grep -E '[\\/]update-key\.pub$' asar.txt
          grep -E '[\\/]update-signature\.cjs$' asar.txt
          ls release
          cat release/latest.yml

      - uses: actions/upload-artifact@v7
        with:
          name: concord-desktop-win
          path: |
            desktop/release/Concord-Setup-*.exe
            desktop/release/Concord-Setup-*.exe.blockmap
            desktop/release/Concord-Setup-*.exe.sig
            desktop/release/latest.yml
          if-no-files-found: error

  build-mac:
    name: Instalador macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Dependências
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Definir versão
        working-directory: desktop
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Gerar instalador
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      # o mesmo do Windows: em PR de fork e do Dependabot o segredo não existe, então só monta, sem assinar
      - name: Assinar a atualização
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.user.login != 'dependabot[bot]')
        working-directory: desktop
        env:
          DESKTOP_UPDATE_KEY: ${{ secrets.DESKTOP_UPDATE_KEY }}
        run: node scripts/sign-update.cjs

      - name: Conferir pacote
        working-directory: desktop
        run: |
          ls release
          cat release/latest-mac.yml

      - uses: actions/upload-artifact@v7
        with:
          name: concord-desktop-mac
          path: |
            desktop/release/Concord-*.dmg
            desktop/release/Concord-*.dmg.blockmap
            desktop/release/Concord-*.dmg.sig
            desktop/release/Concord-*.zip
            desktop/release/Concord-*.zip.blockmap
            desktop/release/Concord-*.zip.sig
            desktop/release/latest-mac.yml
          if-no-files-found: error

  publish:
    name: Publicar na VPS
    needs: [build-win, build-mac]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: concord-desktop-win

      - uses: actions/download-artifact@v8
        with:
          name: concord-desktop-mac

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      # O app serve <dados>/downloads em https://DOMINIO/downloads/.
      # Os latest*.yml vão por último: só depois que os instaladores e assinaturas estão lá os apps veem a versão nova.
      - name: Publicar Windows
        run: |
          D=/opt/concord/data/downloads
          FILE=$(ls Concord-Setup-*.exe | head -1)
          [ -s "$FILE.sig" ] || { echo "::error::Instalador sem assinatura: os apps recusariam a atualização."; exit 1; }
          ssh "$TARGET" "mkdir -p $D"
          scp -q "$FILE" "$FILE.blockmap" "$FILE.sig" "$TARGET:$D/"
          scp -q latest.yml "$TARGET:$D/latest.yml.tmp"
          ssh "$TARGET" "cd $D && mv latest.yml.tmp latest.yml \
            && cp '$FILE' Concord-Setup.exe.tmp && mv Concord-Setup.exe.tmp Concord-Setup.exe \
            && ls -t Concord-Setup-*.exe | tail -n +4 | while read f; do rm -f \"\$f\" \"\$f.blockmap\" \"\$f.sig\"; done"

      - name: Publicar macOS
        run: |
          D=/opt/concord/data/downloads
          DMG=$(ls Concord-*.dmg | head -1)
          ZIP=$(ls Concord-*.zip | head -1)
          scp -q "$DMG" "$TARGET:$D/"
          [ -f "$DMG.blockmap" ] && scp -q "$DMG.blockmap" "$TARGET:$D/"
          [ -f "$DMG.sig" ] && scp -q "$DMG.sig" "$TARGET:$D/"
          scp -q "$ZIP" "$TARGET:$D/"
          [ -f "$ZIP.blockmap" ] && scp -q "$ZIP.blockmap" "$TARGET:$D/"
          [ -f "$ZIP.sig" ] && scp -q "$ZIP.sig" "$TARGET:$D/"
          scp -q latest-mac.yml "$TARGET:$D/latest-mac.yml.tmp"
          ssh "$TARGET" "cd $D && mv latest-mac.yml.tmp latest-mac.yml \
            && cp '$DMG' Concord.dmg.tmp && mv Concord.dmg.tmp Concord.dmg \
            && ls -t Concord-[0-9]*.dmg | tail -n +4 | while read f; do rm -f \"\$f\" \"\$f.blockmap\" \"\$f.sig\"; done \
            && ls -la"
