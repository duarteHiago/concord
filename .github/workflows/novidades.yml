name: Novidades

# PR com mudança visível (título feat/fix) leva a sua nota em client/src/releases/ (ver CLAUDE.md e
# .claude/skills/novidades/SKILL.md). Mudança só interna: rótulo "sem-novidade".
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  nota:
    name: Nota de Novidades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Conferir
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix)(\(.+\))?!?:'; then
            echo "Título não é feat/fix: não precisa de nota."
            exit 0
          fi
          if printf ',%s,' "$LABELS" | grep -q ',sem-novidade,'; then
            echo "Rótulo sem-novidade: mudança interna, sem nota."
            exit 0
          fi

          notes=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | select(.status == "added" or .status == "renamed") | .filename' \
            | grep -E '^client/src/releases/[0-9]{4}-[0-9]{2}-[0-9]{2}[^/]*\.tsx$' || true)
          if [ -z "$notes" ]; then
            echo "::error title=Falta a nota de Novidades::Este PR é feat/fix e não tem nota em client/src/releases/. Rode 'npm run release:draft <assunto>' em client/ e preencha (ver .claude/skills/novidades/SKILL.md). Se a mudança é só interna, ponha o rótulo sem-novidade."
            exit 1
          fi
          echo "Nota de Novidades encontrada:"
          printf '%s\n' "$notes"

          # O id (AAAA-MM-DD-HHMM, começo do nome do arquivo) tem que vir depois de todas as notas da main:
          # quem já viu a mais nova fica "visto até ela" e nunca veria uma nota com id menor.
          latest=$(gh api "repos/$REPO/contents/client/src/releases?ref=$BASE" --jq '.[].name' \
            | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]{4})?' | sort | tail -1)
          for f in $notes; do
            id=$(basename "$f" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]{4})?')
            if ! grep -q "id: '$id'" "$f"; then
              echo "::error file=$f::O id dentro do arquivo precisa ser '$id', igual ao começo do nome."
              exit 1
            fi
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$id" "$latest" | sort | tail -1)" != "$id" -o "$id" = "$latest" ]; then
              echo "::error file=$f::O id $id não vem depois da nota mais nova da main ($latest). Renomeie o arquivo e troque o id para um horário depois de $latest (o 'npm run release:draft' já faz isso)."
              exit 1
            fi
          done
