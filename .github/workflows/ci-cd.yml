name: CI/CD

on:
  push:
    # staging: o Concord de testes (homologação), numa VPS separada — ver deploy/STAGING.md
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# o token do GitHub só lê o código: o deploy é por SSH e nenhum job escreve no repositório
permissions:
  contents: read

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # o app desktop atualiza sozinho no PC de todo mundo: um erro de sintaxe aqui quebraria o app de todos
      - name: Desktop — sintaxe
        run: node --check desktop/main.cjs && node --check desktop/preload.cjs

      - name: Servidor — dependências e checagem de tipos
        working-directory: server
        run: npm ci --no-audit --no-fund && npx tsc --noEmit

      - name: Servidor — testes (permissões e API)
        working-directory: server
        run: npm test

      - name: Cliente — build
        working-directory: client
        run: npm ci --no-audit --no-fund && npm run build

      - name: Imagem Docker
        run: docker build -t concord-app:test .

      - name: E2E — dois navegadores (voz + transmissão de tela)
        run: docker compose -f tests/e2e/docker-compose.yml run --rm pw

      - name: Encerrar ambiente de teste
        if: always()
        run: docker compose -f tests/e2e/docker-compose.yml down -v

  deploy:
    name: Deploy na VPS
    needs: test
    # só roda depois que deploy/setup-cicd.ps1 configurou as variáveis do repositório
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DEPLOY_DOMAIN }}
    env:
      TARGET: ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}
    steps:
      - uses: actions/checkout@v7

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Enviar projeto
        run: |
          # a VPS não recebe o .git: o commit vai num arquivo para aparecer no diagnóstico do app
          echo "${GITHUB_SHA::7}" > client/build-commit.txt
          tar -czf /tmp/concord-deploy.tgz \
            --exclude=.git --exclude=node_modules --exclude=./data --exclude=./data-dev \
            --exclude=dist --exclude=.env .
          scp -q /tmp/concord-deploy.tgz "$TARGET:/tmp/concord-deploy.tgz"

      # secrets do login com Google e do e-mail (Brevo): vão pelo stdin do ssh (não aparecem em linha de comando nem em log)
      - name: Enviar segredos
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET: ${{ secrets.BACKUP_S3_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET" | ssh "$TARGET" "mkdir -p /opt/concord && umask 077 && cat > /opt/concord/.google.env"
          fi
          if [ -n "$BREVO_API_KEY" ]; then
            printf 'BREVO_API_KEY=%s\n' "$BREVO_API_KEY" | ssh "$TARGET" "mkdir -p /opt/concord && umask 077 && cat > /opt/concord/.brevo.env"
          fi
          # chave da biblioteca da Steam na página do perfil
          if [ -n "$STEAM_API_KEY" ]; then
            printf 'STEAM_API_KEY=%s\n' "$STEAM_API_KEY" | ssh "$TARGET" "mkdir -p /opt/concord && umask 077 && cat > /opt/concord/.integrations.env"
          fi
          # chave secreta do captcha do cadastro (Cloudflare Turnstile); a pública vem da variável TURNSTILE_SITE_KEY
          if [ -n "$TURNSTILE_SECRET" ]; then
            printf 'TURNSTILE_SECRET=%s\n' "$TURNSTILE_SECRET" | ssh "$TARGET" "mkdir -p /opt/concord && umask 077 && cat > /opt/concord/.turnstile.env"
          fi
          # chave do bucket dos backups fora da VPS (Cloudflare R2)
          if [ -n "$BACKUP_S3_ACCESS_KEY" ] && [ -n "$BACKUP_S3_SECRET" ]; then
            printf 'BACKUP_S3_ACCESS_KEY=%s\nBACKUP_S3_SECRET=%s\n' "$BACKUP_S3_ACCESS_KEY" "$BACKUP_S3_SECRET" | ssh "$TARGET" "mkdir -p /opt/concord && umask 077 && cat > /opt/concord/.backup.env"
          fi

      # cópia do banco com a versão que ainda está no ar: se o deploy estragar alguma coisa, ela é de minutos atrás.
      # Não segura o deploy se falhar (o backup diário continua), só avisa.
      - name: Backup antes do deploy
        run: |
          ssh "$TARGET" "cd /opt/concord && if [ -n \"\$(docker compose ps -q app 2>/dev/null)\" ]; then \
            docker compose exec -T app node --disable-warning=ExperimentalWarning src/cli.ts backup; \
            else echo 'O app ainda não está rodando: sem backup.'; fi" \
            || echo "::warning title=Backup antes do deploy::O backup falhou; o deploy segue. Veja o log acima."

      # O código é trocado inteiro, não extraído por cima: senão um arquivo apagado no repositório continua na VPS
      # e entra no build (aconteceu com o UserSettingsModal.tsx, apagado no #74). Dados, .env e deploy/ ficam.
      # A lista do Mecenato de cortesia vem de um secret (mascarado no log público), pelo ambiente.
      - name: Instalar e reiniciar
        env:
          MECENATO_COURTESY: ${{ secrets.MECENATO_COURTESY }}
        run: |
          ssh "$TARGET" "mkdir -p /opt/concord \
            && cd /opt/concord && rm -rf client server shared desktop tests examples docs \
            && tar -xzf /tmp/concord-deploy.tgz -C /opt/concord \
            && cd /opt/concord && chmod +x deploy/setup.sh \
            && MODE=${{ vars.DEPLOY_MODE }} DOMAIN=${{ vars.DEPLOY_DOMAIN }} COMMUNITY_INVITE=${{ vars.COMMUNITY_INVITE }} ADMIN_USERS='${{ vars.ADMIN_USERS }}' MECENATO_COURTESY='$MECENATO_COURTESY' MECENAS='${{ vars.MECENAS }}' RECORDING_SERVERS='${{ vars.RECORDING_SERVERS }}' GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }} MAIL_FROM=${{ vars.MAIL_FROM }} TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }} BACKUP_S3_ENDPOINT=${{ vars.BACKUP_S3_ENDPOINT }} BACKUP_S3_BUCKET=${{ vars.BACKUP_S3_BUCKET }} ./deploy/setup.sh"

      # Verifica de dentro da VPS: a Cloudflare costuma bloquear (403) os runners do GitHub.
      - name: Verificar saúde
        run: |
          ssh "$TARGET" "curl -fsS --retry 12 --retry-delay 5 --retry-all-errors http://127.0.0.1:3000/health \
            && echo && (curl -fsS --retry 12 --retry-delay 5 --retry-all-errors http://127.0.0.1:13001/api/health >/dev/null \
              && echo 'Grafana: ok' || echo 'Grafana: não respondeu') \
            && docker ps --filter label=com.docker.compose.project=concord --format '{{.Names}}: {{.Status}}'"

  # Concord de testes (homologação): push na branch staging, numa VPS separada (deploy/STAGING.md).
  # Variáveis próprias (STAGING_*): se faltarem, o job não roda. Nunca cai na VPS de produção por engano.
  # Os secrets ficam no environment "staging" (só a branch staging) e a chave SSH é outra, que não abre a produção.
  # Não leva o backup no bucket (ele apagaria os backups de produção) nem o captcha (a chave é presa ao domínio).
  deploy-staging:
    name: Deploy no Concord de testes
    needs: test
    if: github.ref == 'refs/heads/staging' && github.event_name != 'pull_request' && vars.STAGING_VPS_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ vars.STAGING_DOMAIN }}
    env:
      TARGET: ${{ vars.STAGING_VPS_USER || 'root' }}@${{ vars.STAGING_VPS_HOST }}
      # pasta própria: não mistura com uma instalação antiga que esteja em /opt/concord
      DIR: /opt/concord-staging
    steps:
      - uses: actions/checkout@v7

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.STAGING_VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Enviar projeto
        run: |
          echo "${GITHUB_SHA::7}" > client/build-commit.txt
          tar -czf /tmp/concord-deploy.tgz \
            --exclude=.git --exclude=node_modules --exclude=./data --exclude=./data-dev \
            --exclude=dist --exclude=.env .
          scp -q /tmp/concord-deploy.tgz "$TARGET:/tmp/concord-staging-deploy.tgz"

      # E-mail: de preferência uma chave da Brevo só do teste (STAGING_BREVO_API_KEY), que dá para revogar sem
      # parar a produção; sem ela, usa a da produção. Só quem está em STAGING_USERS recebe. O Google só com um
      # cliente OAuth próprio do teste (STAGING_GOOGLE_*): o da produção tem a marca verificada presa ao domínio dela.
      # A chave da Steam fica de fora: o teste não precisa dela.
      - name: Enviar segredos
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_CLIENT_SECRET }}
          BREVO_API_KEY: ${{ secrets.STAGING_BREVO_API_KEY || secrets.BREVO_API_KEY }}
        run: |
          if [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET" | ssh "$TARGET" "mkdir -p $DIR && umask 077 && cat > $DIR/.google.env"
          fi
          if [ -n "$BREVO_API_KEY" ]; then
            printf 'BREVO_API_KEY=%s\n' "$BREVO_API_KEY" | ssh "$TARGET" "mkdir -p $DIR && umask 077 && cat > $DIR/.brevo.env"
          fi

      # A lista de quem entra vem de secrets (mascarados no log público) e chega pelo ambiente, não pelo script.
      - name: Instalar e reiniciar
        env:
          STAGING_USERS: ${{ secrets.STAGING_USERS }}
          STAGING_ADMIN_USERS: ${{ secrets.STAGING_ADMIN_USERS }}
          STAGING_MECENATO_COURTESY: ${{ secrets.STAGING_MECENATO_COURTESY }}
        run: |
          ssh "$TARGET" "mkdir -p $DIR \
            && cd $DIR && rm -rf client server shared desktop tests examples docs \
            && tar -xzf /tmp/concord-staging-deploy.tgz -C $DIR \
            && cd $DIR && chmod +x deploy/setup.sh \
            && MODE=${{ vars.STAGING_DEPLOY_MODE || 'tunnel' }} DOMAIN=${{ vars.STAGING_DOMAIN }} TUNNEL_NAME=concord-teste \
               FIREWALL=${{ vars.STAGING_FIREWALL || 'on' }} STAGING=true STAGING_USERS='$STAGING_USERS' \
               ADMIN_USERS='$STAGING_ADMIN_USERS' MECENATO_COURTESY='$STAGING_MECENATO_COURTESY' GOOGLE_CLIENT_ID=${{ vars.STAGING_GOOGLE_CLIENT_ID || 'off' }} MAIL_FROM=${{ vars.MAIL_FROM }} \
               ./deploy/setup.sh"

      - name: Verificar saúde
        run: |
          ssh "$TARGET" "curl -fsS --retry 12 --retry-delay 5 --retry-all-errors http://127.0.0.1:3000/health \
            && echo && docker ps --filter label=com.docker.compose.project=concord-staging --format '{{.Names}}: {{.Status}}'"
