<!doctype html>
<!-- Abertura do app desktop: janelinha transparente com o símbolo do Concord se montando enquanto a janela principal
     carrega escondida (ver splash em main.cjs). O main põe a classe "out" no <html> quando a página está pronta. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:" />
<title>Concord</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
  body { display: grid; place-items: center; }
  .stage { position: relative; width: 200px; height: 236px; transition: opacity 0.32s ease, transform 0.32s cubic-bezier(0.4, 0, 1, 1); }
  html.out .stage { opacity: 0; transform: scale(1.06); }
  svg { display: block; overflow: visible; filter: drop-shadow(0 10px 18px rgb(15 27 61 / 0.22)); }

  /* o C cresce girando, passa um pouco do ponto e assenta */
  .c { transform-box: view-box; transform-origin: 108px 108px; animation: c-in 0.62s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  @keyframes c-in { from { transform: scale(0) rotate(-120deg); } to { transform: scale(1) rotate(0); } }

  /* o brilho se desenha por cima */
  .shine { stroke-dasharray: 80; stroke-dashoffset: 80; animation: draw 0.4s 0.5s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* o balão salta para fora do C */
  .bubble { transform-box: view-box; transform-origin: 172px 112px; animation: pop 0.5s 0.42s cubic-bezier(0.34, 1.8, 0.64, 1) both; }
  @keyframes pop { from { transform: scale(0) rotate(-25deg); } to { transform: scale(1) rotate(0); } }

  /* os três pontinhos "digitando" enquanto carrega */
  .dot { transform-box: fill-box; transform-origin: center; opacity: 0; animation: dot-in 0.2s ease-out forwards, typing 1.2s ease-in-out infinite; }
  .dot:nth-child(1) { animation-delay: 0.78s, 1.1s; }
  .dot:nth-child(2) { animation-delay: 0.86s, 1.25s; }
  .dot:nth-child(3) { animation-delay: 0.94s, 1.4s; }
  @keyframes dot-in { to { opacity: 1; } }
  @keyframes typing { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

  /* faíscas saindo do balão quando ele aparece */
  .spark { position: absolute; left: 159px; top: 107px; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: #4f7cff; opacity: 0;
    animation: spark 0.75s 0.68s cubic-bezier(0.2, 0.7, 0.3, 1) forwards; }
  .spark.coral { background: #ff7a6a; }
  .spark.small { width: 6px; height: 6px; margin: -3px; }
  @keyframes spark { 0% { opacity: 1; transform: translate(calc(var(--x) * 0.45), calc(var(--y) * 0.45)) scale(1); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(0.4); } }

  /* linha de carregamento embaixo do símbolo */
  .bar { position: absolute; left: 50%; bottom: 0; width: 64px; height: 4px; margin-left: -32px; border-radius: 4px; overflow: hidden;
    background: rgb(31 79 209 / 0.16); opacity: 0; animation: fade-in 0.3s 1s ease-out forwards; }
  .bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 4px; background: #1f4fd1; animation: sweep 1.1s 1s ease-in-out infinite; }
  @keyframes fade-in { to { opacity: 1; } }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

  @media (prefers-reduced-motion: reduce) {
    .c, .bubble, .shine, .dot, .spark, .bar, .bar::after { animation: none !important; }
    .shine { stroke-dashoffset: 0; }
    .dot, .bar { opacity: 1; }
    .stage { animation: fade-in 0.3s ease-out both; opacity: 0; }
  }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 216 216" width="200" height="200" aria-label="Concord">
    <g transform="translate(4 8)">
      <g class="c">
        <g transform="translate(8 8)">
          <g fill="#0F1B3D" stroke="#0F1B3D" stroke-width="14" stroke-linejoin="round"><path d="M155.2,44.8 A78,78 0 1,0 155.2,155.2 L124,124 A34,34 0 1,1 124,76 Z"/><circle cx="139.6" cy="60.4" r="22"/><circle cx="139.6" cy="139.6" r="22"/></g>
          <g fill="#1F4FD1"><path d="M155.2,44.8 A78,78 0 1,0 155.2,155.2 L124,124 A34,34 0 1,1 124,76 Z"/><circle cx="139.6" cy="60.4" r="22"/><circle cx="139.6" cy="139.6" r="22"/></g>
          <path class="shine" d="M44,88 A60,60 0 0,1 72,48" fill="none" stroke="#9DB8FF" stroke-width="9" stroke-linecap="round"/>
        </g>
      </g>
      <g class="bubble">
        <g transform="translate(8 8)">
          <g fill="#0F1B3D" stroke="#0F1B3D" stroke-width="14" stroke-linejoin="round"><circle cx="160" cy="100" r="26"/><path d="M148,118 Q156,134 182,138 Q170,128 170,110 Z"/></g>
          <g fill="#FF7A6A"><circle cx="160" cy="100" r="26"/><path d="M148,118 Q156,134 182,138 Q170,128 170,110 Z"/></g>
          <g fill="#0F1B3D"><circle class="dot" cx="149" cy="100" r="4"/><circle class="dot" cx="160" cy="100" r="4"/><circle class="dot" cx="171" cy="100" r="4"/></g>
        </g>
      </g>
    </g>
  </svg>
  <i class="spark" style="--x: 46px; --y: -38px"></i>
  <i class="spark small coral" style="--x: 58px; --y: -6px"></i>
  <i class="spark" style="--x: 40px; --y: 34px"></i>
  <i class="spark small" style="--x: 14px; --y: 52px"></i>
  <i class="spark coral" style="--x: 6px; --y: -56px"></i>
  <i class="spark small" style="--x: 30px; --y: -60px"></i>
  <i class="spark small coral" style="--x: 54px; --y: 22px"></i>
  <div class="bar"></div>
</div>
</body>
</html>
