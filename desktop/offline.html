<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Concord: sem conexão</title>
    <style>
      /* Tela do app de Windows quando o servidor não responde. Cores da marca, sem fonte da web (pode estar sem internet). */
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f8fd;
        color: #0f1b3d;
        font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
      }
      main {
        width: min(440px, 90vw);
        padding: 36px 32px 32px;
        border-radius: 28px;
        background: #ffffff;
        box-shadow: 0 0 0 1px #d3dbeb, 0 20px 40px -24px rgb(15 27 61 / .35);
        text-align: center;
      }
      img { display: block; margin: 0 auto 16px; }
      h1 { margin: 0 0 8px; font-size: 23px; line-height: 1.2; font-weight: 800; }
      p { margin: 0; color: #52608a; font-size: 15px; line-height: 1.5; }
      code { display: block; min-height: 1em; margin-top: 10px; color: #52608a; font: 13px Consolas, "Cascadia Mono", monospace; word-break: break-all; }
      code:empty { display: none; }
      label { display: block; margin-top: 22px; text-align: left; font-size: 14px; font-weight: 700; color: #52608a; }
      input {
        width: 100%;
        box-sizing: border-box;
        height: 44px;
        margin-top: 6px;
        padding: 0 14px;
        border-radius: 12px;
        border: 2px solid #d3dbeb;
        background: #ffffff;
        color: inherit;
        font: inherit;
        font-size: 15px;
      }
      input:focus { outline: none; border-color: #52608a; }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button {
        flex: 1;
        height: 44px;
        border: 0;
        border-radius: 999px;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        color: #0f1b3d;
        background: transparent;
        box-shadow: inset 0 0 0 2px #d3dbeb;
      }
      button:hover { box-shadow: inset 0 0 0 2px #52608a; }
      button.primary { background: #1f4fd1; color: #ffffff; box-shadow: none; }
      button.primary:hover { background: #1a43b2; }
      button:focus-visible, input:focus-visible { outline: 3px solid #ff7a6a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="build/icon.png" alt="" width="72" height="72" />
      <h1>Não deu pra conectar</h1>
      <p>O servidor do Concord não respondeu. Confere a internet ou o endereço do servidor.</p>
      <code id="error"></code>
      <label for="server">Endereço do servidor</label>
      <input id="server" placeholder="https://concord.seudominio.com" />
      <div class="row">
        <button id="retry" class="primary">Tentar de novo</button>
        <button id="save">Trocar servidor</button>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById('server').value = params.get('server') || '';
      document.getElementById('error').textContent = params.get('error') || '';
      document.getElementById('retry').onclick = () => window.concordDesktop.reload();
      document.getElementById('save').onclick = () =>
        window.concordDesktop.setServer(document.getElementById('server').value).catch((e) => alert(e.message));
    </script>
  </body>
</html>
