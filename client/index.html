<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ecf0f9" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Concord: app de voz, chat e transmissão de tela a 60 fps pra jogar com a galera. Grátis, sem anúncio e com o código aberto." />
    <!-- prévia do link no X, WhatsApp, Discord etc. Os robôs não rodam o JS abaixo, então as tags ficam aqui -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Concord" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://concord-community.com/" />
    <meta property="og:title" content="Concord: a call da sua galera, de graça" />
    <meta property="og:description" content="Voz, chat e transmissão de tela a 60 fps. Sem anúncio, sem plano pago e com o código aberto." />
    <meta property="og:image" content="https://concord-community.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Concord: a call da sua galera, de graça. Print de uma sala de voz com transmissão de tela." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Concord</title>
    <script>
      // Visitante sem login cai na landing page; o app desktop, o link "Entrar" (/?entrar) e as voltas do Google
      // e dos links de e-mail (confirmar, trocar senha) vão direto para o app. O Concord de testes não tem landing.
      try {
        if ('%VITE_STAGING%' !== 'true' && location.pathname === '/' && !localStorage.getItem('concord.token') && !/Electron\//.test(navigator.userAgent) && !/[?&]entrar\b/.test(location.search) && !/google-|verify-email=|reset-email=/.test(location.hash)) {
          location.replace('/inicio/');
        }
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
