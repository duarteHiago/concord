# Monitoramento ao vivo: Prometheus coleta, Grafana mostra (em https://DOMINIO/grafana).
# Tudo na rede do host e escutando só em 127.0.0.1: nada disso fica exposto na internet;
# o único acesso de fora é o Grafana, pelo Caddy, com login.
# Portas pouco comuns de propósito, para não brigar com outros serviços da VPS.

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    network_mode: host
    user: "0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${MONITORING_RETENTION:-15d}
      - --storage.tsdb.retention.size=3GB
      - --web.listen-address=127.0.0.1:19090
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 1g

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "13001"
      GF_SERVER_DOMAIN: ${DOMAIN}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/visao-geral.json
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: browser
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 512m

  # CPU, RAM, disco, rede e sistema da VPS
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:19100
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/snap/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
    mem_limit: 128m

  # consumo de cada container (mesmos números do `docker stats`; funciona em qualquer versão do Docker)
  docker-exporter:
    image: node:24-alpine
    restart: unless-stopped
    network_mode: host
    command: [node, /app/docker-exporter.mjs]
    environment:
      HOST: 127.0.0.1
      PORT: "19323"
    volumes:
      - ./deploy/monitoring/docker-exporter.mjs:/app/docker-exporter.mjs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 96m

  # latência: o site visto de fora (pela Cloudflare), por dentro, LiveKit e ping
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.listen-address=127.0.0.1:19115
    volumes:
      - ./deploy/monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    mem_limit: 64m

volumes:
  prometheus_data:
  grafana_data:
