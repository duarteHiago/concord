# Produção (VPS Linux). Use: ./deploy/setup.sh  — ou preencha o .env e rode `docker compose up -d --build`.
# Todos os serviços usam a rede do host: melhor desempenho para WebRTC e sem NAT do Docker no caminho da mídia.

services:
  app:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      COMMUNITY_INVITE: ${COMMUNITY_INVITE:-}
      AUTHORITY_SERVER_ID: ${AUTHORITY_SERVER_ID:-}
      ADMIN_USERS: ${ADMIN_USERS:-}
      MECENAS: ${MECENAS:-}
      PUBLIC_URL: https://${DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      # apoio por Pix (Mercado Pago). Vazio: o botão de apoiar não aparece
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Concord}
      # o logo dos e-mails vem do GitHub: o Gmail busca imagens por servidores do Google, que a proteção anti-bot do site pode barrar
      MAIL_LOGO_URL: ${MAIL_LOGO_URL:-https://raw.githubusercontent.com/duarteHiago/concord/main/client/public/brand/concord-logo.png}
      LIVEKIT_API_URL: http://127.0.0.1:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?defina LIVEKIT_API_KEY no .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?defina LIVEKIT_API_SECRET no .env}
    volumes:
      - ./data:/data
    depends_on:
      - livekit

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
